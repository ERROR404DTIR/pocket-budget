<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111b"><meta name="description" content="Know where your money goes. Keep the numbers yours."><title>PocketBudget</title><style>:root{color-scheme:dark;--bg:#0d111b;--panel:#151c2a;--line:#293449;--text:#eef2ff;--muted:#9aa8bf;--accent:#89b4fa;--green:#a6e3a1;--red:#f38ba8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1d2940 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1080px;margin:0 auto;padding:34px 20px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.tag{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:5px 9px;border-radius:99px}.hero{margin:25px 0 28px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-1.5px;margin:8px 0}.hero p,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns: minmax(0,1.15fr) minmax(280px,.85fr);gap:18px}.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.panel h2{font-size:16px;margin:0 0 15px}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#101725;border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:clamp(17px,3vw,24px);overflow-wrap:anywhere;margin-top:4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0d1421;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:grid;gap:6px;color:var(--muted);font-size:13px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#101522;font-weight:700;cursor:pointer}button.secondary{background:#263249;color:var(--text)}button.danger{background:#482637;color:#ffdce5}button:disabled{opacity:.45;cursor:not-allowed}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#101725}.item small{display:block;color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.good{color:var(--green)}.bad{color:var(--red)}.wide{grid-column:1/-1}footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start}}@media print{body{background:white;color:#111}.panel,.stat,.item{background:white;color:#111;border-color:#ddd}button,.tag,footer{display:none!important}main{max-width:none;padding:0}}</style></head><body><main><header><div class="brand">PocketBudget</div><span class="tag">LOCAL · PRIVATE · FREE</span></header><section class="hero"><span class="tag">ERROR404DTIR / OPEN SOURCE</span><h1>PocketBudget</h1><p>Know where your money goes. Keep the numbers yours.</p></section><div class="layout"><section class="panel"><h2>Add a transaction</h2><form id="form" class="stack"><div class="row"><label>Title<input id="title" required maxlength="70" placeholder="Groceries"></label><label>Amount<input id="amount" type="number" min=".01" step=".01" required placeholder="25.00"></label></div><div class="row"><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Category<select id="category"><option>Food</option><option>Transport</option><option>Home</option><option>Health</option><option>Shopping</option><option>Salary</option><option>Other</option></select></label></div><label>Date<input id="date" type="date" required></label><button>Add transaction</button></form><div class="actions"><button class="secondary" id="export">Export CSV</button><button class="secondary" id="backup">Backup JSON</button><label class="tag">Restore<input id="restore" type="file" accept="application/json" hidden></label></div></section><section class="panel"><h2>Overview</h2><div class="stats"><div class="stat"><small>Income</small><strong id="income" class="good">$0</strong></div><div class="stat"><small>Expenses</small><strong id="expense" class="bad">$0</strong></div><div class="stat"><small>Balance</small><strong id="balance">$0</strong></div></div><label>Month<select id="month"></select></label><p class="muted" id="count">0 transactions</p><div id="items" class="list"></div></section></div><footer>Made to be useful. Runs in your browser. Your data stays on this device.</footer></main><script>const $=id=>document.getElementById(id),key='pocketbudget.v1';let data=JSON.parse(localStorage.getItem(key)||'[]');$('date').value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem(key,JSON.stringify(data));render()}function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(n)}function render(){let months=[...new Set([new Date().toISOString().slice(0,7),...data.map(x=>x.date.slice(0,7))])].sort().reverse();let m=$('month').value||months[0];$('month').innerHTML=months.map(x=>'<option>'+x+'</option>').join('');$('month').value=m;let rows=data.filter(x=>x.date.startsWith(m));let inc=rows.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=rows.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);$('count').textContent=rows.length+' transactions';$('items').innerHTML=rows.length?rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<div class="item"><div><b>'+esc(x.title)+'</b><small>'+esc(x.category)+' · '+x.date+'</small></div><div class="row" style="flex:0 0 auto"><b class="'+(x.type==='income'?'good':'bad')+'">'+(x.type==='income'?'+':'−')+money(x.amount)+'</b><button class="danger" data-id="'+x.id+'">×</button></div></div>').join(''):'<div class="empty">No transactions for this month yet.</div>'}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('form').onsubmit=e=>{e.preventDefault();data.push({id:crypto.randomUUID(),title:$('title').value,amount:Number($('amount').value),type:$('type').value,category:$('category').value,date:$('date').value});e.target.reset();$('date').value=new Date().toISOString().slice(0,10);save()};$('items').onclick=e=>{let b=e.target.closest('[data-id]');if(b&&confirm('Delete this transaction?')){data=data.filter(x=>x.id!==b.dataset.id);save()}};$('month').onchange=render;function download(name,txt,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([txt],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}$('export').onclick=()=>download('transactions.csv','Date,Title,Type,Category,Amount\n'+data.map(x=>[x.date,x.title,x.type,x.category,x.amount].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');$('backup').onclick=()=>download('pocketbudget-backup.json',JSON.stringify(data,null,2),'application/json');$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v))throw Error();data=v;save()}catch{alert('Invalid backup file')}};render();</script></body></html>
